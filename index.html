<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#080b15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokéAtlas">
<meta name="description" content="Tus nueve aventuras Pokémon en un solo lugar. Pokédex, rutas y capturas con progreso guardado en el iPhone.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>PokéAtlas · Tus 9 aventuras</title>
</head>
<body>
<div class="ambient-grid" aria-hidden="true"></div>
<div class="ambient-glow" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>
<div id="app">
  <header class="top-nav">
    <div class="nav-inside">
      <button id="brand-button" type="button" class="brand-button" aria-label="Volver al menú principal">
        <span class="brand-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4 16h24" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="4.3" fill="#090b14" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/></svg></span>
        <span class="brand-word">POKÉ<span>ATLAS</span><small>YOUR CATCHING COMPANION</small></span>
      </button>
      <div class="nav-right">
        <span class="nav-status"><span class="status-dot"></span><span id="nav-status-text">9 AVENTURAS</span></span>
        <button id="backup-shortcut" class="nav-icon-button" type="button" title="Copias de seguridad" aria-label="Copias de seguridad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg></button>
      </div>
    </div>
  </header>
  <main id="view" class="main-shell" tabindex="-1">
    <section class="boot-message"><span class="boot-orb"></span><p>Preparando tus aventuras...</p></section>
  </main>
  <footer class="app-footer"><span>HECHO PARA ENTRENADORES</span><span>POKÉATLAS © 2026 · PROYECTO NO OFICIAL</span></footer>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-import" hidden accept="application/json,.json">
<script src="./names.js" defer></script>
<script src="./game-data.js" defer></script>
<script src="./guides.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
